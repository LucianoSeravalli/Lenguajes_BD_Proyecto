<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragmentos compartidos.
  Hay DOS cabeceras:
    header(activo)        -> panel interno, solo para sesion iniciada
    headerPublico(activo) -> sitio publico, sin sesion
-->
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'GymCore | ' + ${titulo}">GymCore</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/gymcore.css}">
</head>

<body>

<!-- ============ HEADER DEL PANEL (requiere sesion) ============ -->
<header th:fragment="header(activo)">
  <nav class="navbar navbar-expand-lg gym-navbar sticky-top">
    <div class="container-fluid px-4">

      <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/panel}">
        <span class="gym-logo"><i class="bi bi-lightning-charge-fill"></i></span>
        <span>Gym<strong>Core</strong></span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuPrincipal" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/panel}"
               th:classappend="${activo == 'inicio'} ? ' active'">
              <i class="bi bi-speedometer2"></i> Panel
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/recepcion}"
               th:classappend="${activo == 'recepcion'} ? ' active'">
              <i class="bi bi-door-open"></i> Recepcion
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/clientes}"
               th:classappend="${activo == 'clientes'} ? ' active'">
              <i class="bi bi-people"></i> Clientes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/clases}"
               th:classappend="${activo == 'clases'} ? ' active'">
              <i class="bi bi-calendar-week"></i> Clases
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/membresias}"
               th:classappend="${activo == 'membresias'} ? ' active'">
              <i class="bi bi-credit-card"></i> Membresias
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:href="@{/rutinas}"
               th:classappend="${activo == 'rutinas'} ? ' active'">
              <i class="bi bi-clipboard-pulse"></i> Rutinas
            </a>
          </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
          <span class="gym-estado" id="estadoConexion">
            <i class="bi bi-circle-fill"></i> <span>Conectando...</span>
          </span>

          <!-- El nombre sale de la sesion que guarda AuthController. -->
          <span class="gym-usuario" th:if="${session.usuarioNombre != null}">
            <i class="bi bi-person-circle"></i>
            <span th:text="${session.usuarioNombre}">Usuario</span>
          </span>

          <a class="btn btn-sm btn-gym-outline" th:href="@{/logout}">
            <i class="bi bi-box-arrow-right"></i> Salir
          </a>
        </div>
      </div>

    </div>
  </nav>
</header>

<!-- ============ HEADER PUBLICO (sitio de marketing) ============ -->
<header th:fragment="headerPublico(activo)">
  <nav class="navbar navbar-expand-lg gym-navbar sticky-top">
    <div class="container px-3">

      <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
        <span class="gym-logo"><i class="bi bi-lightning-charge-fill"></i></span>
        <span>Gym<strong>Core</strong></span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#menuPublico" aria-label="Menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPublico">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/#servicios">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="/#planes">Planes</a></li>
          <li class="nav-item"><a class="nav-link" href="/#sedes">Sedes</a></li>
          <li class="nav-item"><a class="nav-link" href="/#contacto">Contacto</a></li>
        </ul>

        <div class="d-flex align-items-center gap-2">
          <a class="btn btn-sm btn-gym-outline" th:href="@{/login}">
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
          </a>
          <a class="btn btn-sm btn-gym" th:href="@{/registro}">
            <i class="bi bi-person-plus"></i> Crear cuenta
          </a>
        </div>
      </div>

    </div>
  </nav>
</header>

<div th:fragment="avisos" class="gym-avisos" id="avisos"></div>

<footer th:fragment="footer" class="gym-footer">
  <div class="container-fluid px-4 py-3 d-flex flex-wrap justify-content-between gap-2">
    <span>GymCore &mdash; Base de datos para cadena de gimnasios a nivel nacional</span>
    <span class="text-secondary">Universidad Fidelitas &middot; Grupo 06</span>
  </div>
</footer>

<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/gymcore.js}"></script>
</th:block>

</body>
</html>
