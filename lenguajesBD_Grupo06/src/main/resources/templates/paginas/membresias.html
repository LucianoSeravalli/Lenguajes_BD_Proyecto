<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Membresias')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('membresias')}"></header>
<div th:replace="~{fragments/layout :: avisos}"></div>

<main class="container-fluid px-4 py-4">

  <h1 class="h4 mb-1">Membresias y pagos</h1>
  <p class="text-secondary mb-4">
    Administra planes, contratos y pagos de membresias desde una sola vista.
  </p>

  <div class="row g-3">
    <div class="col-lg-4">
      <section class="gym-panel mb-3">
        <div class="gym-panel-cabecera"><i class="bi bi-card-checklist me-2"></i>Contratar</div>
        <div class="gym-panel-cuerpo">
          <form id="formMembresia" autocomplete="off">
            <label class="form-label">Cliente</label>
            <select class="form-select mb-3" name="idCliente" id="selectCliente" required></select>

            <label class="form-label">Tipo de membresia</label>
            <select class="form-select mb-3" name="idTipoMembresia" id="selectTipo" required></select>

            <label class="form-label">Fecha de inicio</label>
            <input class="form-control mb-3" type="date" name="fechaInicio">

            <button class="btn btn-gym w-100" type="submit">Contratar</button>
          </form>
        </div>
      </section>

      <section class="gym-panel">
        <div class="gym-panel-cabecera"><i class="bi bi-cash-coin me-2"></i>Registrar pago</div>
        <div class="gym-panel-cuerpo">
          <form id="formPago" autocomplete="off">
            <label class="form-label">Id de membresia</label>
            <input class="form-control mb-3" type="number" name="idMembresia" required>

            <label class="form-label">Monto</label>
            <input class="form-control mb-3" type="number" step="0.01" min="0.01"
                   name="monto" required>

            <label class="form-label">Metodo</label>
            <select class="form-select mb-3" name="metodoPago" required>
              <option value="efectivo">Efectivo</option>
              <option value="tarjeta">Tarjeta</option>
              <option value="transferencia">Transferencia</option>
              <option value="sinpe">SINPE</option>
            </select>

            <label class="form-label">Estado</label>
            <select class="form-select mb-3" name="estado">
              <option value="completado">Completado</option>
              <option value="pendiente">Pendiente</option>
            </select>

            <button class="btn btn-gym w-100" type="submit">Registrar pago</button>
          </form>
        </div>
      </section>
    </div>

    <div class="col-lg-8">
      <section class="gym-panel mb-3">
        <div class="gym-panel-cabecera"><i class="bi bi-tags me-2"></i>Tipos disponibles</div>
        <div class="table-responsive">
          <table class="table table-borderless mb-0">
            <thead><tr><th>Nombre</th><th>Duracion</th><th>Precio</th><th>Beneficios</th></tr></thead>
            <tbody id="tablaTipos"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script>
async function cargarTipos() {
  try {
    const tipos = await api.get('/membresias/tipos');
    document.getElementById('tablaTipos').innerHTML = tipos.map(t => `
      <tr>
        <td>${limpio(t.nombre)}</td>
        <td>${t.duracionMeses} mes(es)</td>
        <td>${colones(t.precio)}</td>
        <td class="text-secondary">${limpio(t.beneficios) || '\u2014'}</td>
      </tr>`).join('');

    document.getElementById('selectTipo').innerHTML = tipos.map(t =>
      `<option value="${t.idTipoMembresia}">${limpio(t.nombre)} — ${colones(t.precio)}</option>`
    ).join('');
  } catch (e) { filaVacia(document.getElementById('tablaTipos'), 4, e.message); }
}

async function cargarClientes() {
  try {
    const clientes = await api.get('/clientes');
    document.getElementById('selectCliente').innerHTML = clientes.map(c =>
      `<option value="${c.idCliente}">${limpio(c.nombre)} ${limpio(c.apellido)} — ${limpio(c.cedula)}</option>`
    ).join('');
  } catch (e) { avisar(e.message, 'error'); }
}


document.getElementById('formMembresia').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const datos = datosDe(ev.target);
  datos.idCliente = Number(datos.idCliente);
  datos.idTipoMembresia = Number(datos.idTipoMembresia);
  try {
    const m = await api.post('/membresias', datos);
    avisar(`Membresia #${m.idMembresia} creada, vence ${fecha(m.fechaFin)}.`, 'ok');
  } catch (e) { avisar(e.message, 'error'); }
});

document.getElementById('formPago').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const datos = datosDe(ev.target);
  datos.idMembresia = Number(datos.idMembresia);
  datos.monto = Number(datos.monto);
  try {
    const r = await api.post('/pagos', datos);
    avisar(r.mensaje, 'ok');
    ev.target.reset();
  } catch (e) { avisar(e.message, 'error'); }
});

document.addEventListener('DOMContentLoaded', () => {
  cargarTipos();
  cargarClientes();
});
</script>
</body>
</html>
